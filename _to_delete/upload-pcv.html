pply control systems (Runcorn design facility).\"\n        },\n        {\n          \"date\": \"13 Apr\",\n          \"text\": \"Contract signed with GBE-N for site-specific design at Wylfa; long lead-time equipment ordering begins.\"\n        },\n        {\n          \"date\": \"24 Apr\",\n          \"text\": \"Early Works Contract signed with CEZ Group for Czech Republic's first SMR at Temel\u00edn (up to 3GW).\"\n        },\n        {\n          \"date\": \"May\",\n          \"text\": \"\u0160koda JS and Doosan Enerbility appointed as dual suppliers for nuclear island components.\"\n        },\n        {\n          \"date\": \"15 Jun\",\n          \"text\": \"Selected by Videberg Kraft (Vattenfall) to deliver 3 SMRs at V\u00e4r\u00f6 Peninsula, Sweden \u2014 third European contract win.\"\n        },\n        {\n          \"date\": \"26 Jun\",\n          \"text\": \"Pioneer Works manufacturing development centre announced for Derby \u2014 precision assembly, welding & testing, ~40 skilled roles.\"\n        }\n      ],\n      \"what_it_means\": \"Only supplier with multiple signed SMR contracts in Europe (UK, Czechia, Sweden). Programme momentum is real, not speculative. Overseas nuclear-island awards (\u0160koda JS, Doosan) show the 70% UK-content ambition will require active supplier qualification to win work.\"\n    },\n    {\n      \"id\": 11,\n      \"type\": \"programme_update\",\n      \"country\": \"UK\",\n      \"group\": \"UK Nuclear Programme\",\n      \"title\": \"AP300: 2026 Programme Update\",\n      \"subtitle\": \"UK nuclear sector briefing for F4N cohort July 2026\",\n      \"stats\": [\n        {\n          \"value\": \"Withdrew\",\n          \"label\": \"From GBN/Wylfa competition, April 2025\"\n        },\n        {\n          \"value\": \"4 units\",\n          \"label\": \"Private AP300 fleet planned, North Teesside\"\n        },\n        {\n          \"value\": \"80 yrs\",\n          \"label\": \"Springfields fuel site milestone, March 2026\"\n        },\n        {\n          \"value\": \"Step 1\",\n          \"label\": \"UK GDA complete; Step 2 assessment ongoing\"\n        }\n      ],\n      \"timelineTitle\": \"2025\u201326 STATUS TIMELINE\",\n      \"milestones\": [\n        {\n          \"date\": \"Apr '25\",\n          \"text\": \"Westinghouse withdraws from Great British Nuclear's SMR competition; Rolls-Royce selected as preferred UK partner two months later.\"\n        },\n        {\n          \"date\": \"2025\",\n          \"text\": \"Six UK supplier MoUs signed (William Cook, Trillium Flow, Curtiss-Wright UK, Boccard UK, Bendalls Engineering, Sheffield Forgemasters).\"\n        },\n        {\n          \"date\": \"30 Mar '26\",\n          \"text\": \"Springfields, Lancashire marks 80 years as the world's oldest continuously operating nuclear fuel manufacturing site.\"\n        },\n        {\n          \"date\": \"Ongoing '26\",\n          \"text\": \"AP300 remains in UK 2-step GDA (Step 1 complete). Community Nuclear Power continues developing the privately financed 4-unit fleet at North Teesside, targeting a licensed site by 2027.\"\n        }\n      ],\n      \"what_it_means\": \"Unlike Rolls-Royce, Holtec and X-energy, Westinghouse is not part of the government-backed Wylfa programme. Its UK SMR future rests on the privately financed Teesside project \u2014 a different risk profile, potentially faster to market without government procurement timelines.\"\n    },\n    {\n      \"id\": 12,\n      \"type\": \"programme_update\",\n      \"country\": \"UK\",\n      \"group\": \"UK Nuclear Programme\",\n      \"title\": \"Xe-100: 2026 Programme Update\",\n      \"subtitle\": \"UK nuclear sector briefing for F4N cohort July 2026\",\n      \"stats\": [\n        {\n          \"value\": \"6 GW\",\n          \"label\": \"Proposed UK fleet at Hartlepool\"\n        },\n        {\n          \"value\": \"GDA\",\n          \"label\": \"Xe-100 submitted June 2026\"\n        },\n        {\n          \"value\": \"$1bn+\",\n          \"label\": \"Raised in Nasdaq IPO, April 2026\"\n        },\n        {\n          \"value\": \"\u00a340bn\",\n          \"label\": \"Estimated lifetime UK economic value\"\n        }\n      ],\n      \"timelineTitle\": \"2026 MILESTONE TIMELINE\",\n      \"milestones\": [\n        {\n          \"date\": \"Feb\",\n          \"text\": \"US NRC approves the TX-1 fuel facility's Part 70 licence for TRISO-X fuel handling \u2014 first Category II licence ever issued.\"\n        },\n        {\n          \"date\": \"Apr\",\n          \"text\": \"UK Government confirms Future Nuclear Enabling Fund award (\u00a36.68m); Kier Group joins as UK constructability and supply chain partner.\"\n        },\n        {\n          \"date\": \"24 Apr\",\n          \"text\": \"X-energy lists on Nasdaq (ticker: XE), raising over $1bn \u2014 the largest nuclear IPO on record.\"\n        },\n        {\n          \"date\": \"2 Jun\",\n          \"text\": \"Xe-100 HTGR formally submitted into the UK Generic Design Assessment (GDA). Regulatory review expected to conclude by end of 2029.\"\n        },\n        {\n          \"date\": \"16 Jun\",\n          \"text\": \"Closes $700m Series D: $1.4bn raised in a year, $1.8bn total; 144 SMR orders logged globally (11GW).\"\n        }\n      ],\n      \"what_it_means\": \"Earliest-stage UK programme: GDA only just submitted, not expected to conclude until end-2029. Longer runway to prepare, but least near-term certainty. The Xe-100 is a helium-cooled, graphite-moderated HTGR \u2014 different technology and supply chain from PWR-based SMRs.\"\n    },\n    {\n      \"id\": 13,\n      \"type\": \"programme_update\",\n      \"country\": \"UK\",\n      \"group\": \"UK Nuclear Programme\",\n      \"title\": \"STEP Fusion: 2026 Programme Update\",\n      \"subtitle\": \"UK nuclear sector briefing for manufacturing supply chain partners\",\n      \"stats\": [\n        {\n          \"value\": \"\u00a31.3bn\",\n          \"label\": \"Government funding for STEP via UK Fusion Energy\"\n        },\n        {\n          \"value\": \"\u00a3200m\",\n          \"label\": \"ILIOS Construction Partner initial contract\"\n        },\n        {\n          \"value\": \"\u00a370m\",\n          \"label\": \"Tokamak Energy magnets contract to March 2029\"\n        },\n        {\n          \"value\": \"8,000\",\n          \"label\": \"Peak construction jobs expected at West Burton\"\n        }\n      ],\n      \"timelineTitle\": \"2026 MILESTONE TIMELINE\",\n      \"milestones\": [\n        {\n          \"date\": \"14 Jan\u201311 Mar\",\n          \"text\": \"First public consultation on STEP Fusion's DCO held across North Nottinghamshire, Lincolnshire and South Yorkshire communities.\"\n        },\n        {\n          \"date\": \"Mar\",\n          \"text\": \"ILIOS consortium (Kier-Nuvia JV, with AECOM, AL_A and Turner & Townsend) appointed Construction Partner \u2014 \u00a3200m initial contract, up to 8,000 jobs at peak.\"\n        },\n        {\n          \"date\": \"23 Mar\",\n          \"text\": \"UKAEA completes first phase of West Burton site acquisition from EDF \u2014 land transferred 3.5 years ahead of schedule.\"\n        },\n        {\n          \"date\": \"14 Apr\",\n          \"text\": \"Tokamak Energy named Magnet Systems Partner \u2014 \u00a370m contract to March 2029, securing UK sovereign HTS magnet capability.\"\n        },\n        {\n          \"date\": \"Mid-Apr\",\n          \"text\": \"At Fusion Fest 2026, UK Fusion Energy and UKAEA launch strategies to 2030/2040; \u00a330m Dassault Syst\u00e8mes digital/PLM deal signed.\"\n        }\n      ],\n      \"what_it_means\": \"STEP is a single UK national programme, not a multi-vendor competition \u2014 the entry point is UKFE's own procurement portal. Already a live, spending programme with \u00a3108.8m industry contracts placed and site construction starting. Earlier in spend terms than most SMR programmes.\"\n    },\n    {\n      \"id\": 14,\n      \"type\": \"programme_update\",\n      \"country\": \"UK\",\n      \"group\": \"UK Nuclear Programme\",\n      \"title\": \"Decommissioning Programmes: 2026 Update\",\n      \"subtitle\": \"UK nuclear sector briefing for manufacturing supply chain partners\",\n      \"stats\": [\n        {\n          \"value\": \"\u00a31.8bn\",\n          \"label\": \"NDA group's annual supply chain spend\"\n        },\n        {\n          \"value\": \"\u00a345m\",\n          \"label\": \"SME win: LTi Metaltech, Sellafield SRP, Feb 2026\"\n        },\n        {\n          \"value\": \"New Strategy\",\n          \"label\": \"NDA group Strategy effective March 2026\"\n        },\n        {\n          \"value\": \"1st AGRs\",\n          \"label\": \"Hunterston B & Hinkley Pt B transfer to NDA in 2026\"\n        }\n      ],\n      \"timelineTitle\": \"2026 MILESTONE TIMELINE\",\n      \"milestones\": [\n        {\n          \"date\": \"Oct '25\",\n          \"text\": \"Three companies win contracts worth up to \u00a32.9bn for non-nuclear infrastructure works at Sellafield \u2014 context for the scale of work entering the market.\"\n        },\n        {\n          \"date\": \"18 Feb\",\n          \"text\": \"Sellafield awards a \u00a345m contract to LTi Metaltech to supply plutonium storage containers ('100-year cans') for the new Product and Residue Store Retreatment Plant.\"\n        },\n        {\n          \"date\": \"23 Feb\",\n          \"text\": \"NDA publishes its latest group Strategy, effective March 2026 \u2014 a refreshed roadmap prioritising hazard reduction and collaboration.\"\n        },\n        {\n          \"date\": \"During '26\",\n          \"text\": \"Hunterston B becomes the first AGR site to transfer from EDF Energy to the NDA group for decommissioning, with Hinkley Point B to follow.\"\n        },\n        {\n          \"date\": \"21 May\",\n          \"text\": \"Sellafield's PPP marks 7 years, with major projects (SRP, SIXEP Continuity Plant, BEPPS2, LSS1) progressing through construction and design.\"\n        }\n      ],\n      \"what_it_means\": \"The largest, steadiest source of UK nuclear manufacturing demand in this briefing \u2014 \u00a31.8bn spent every year, for decades, regardless of how any single SMR programme fares. LTi Metaltech's \u00a345m win shows UK SMEs can secure significant contracts in this market.\"\n    },\n    {\n      \"id\": 15,\n      \"type\": \"overview\",\n      \"country\": \"UK\",\n      \"group\": \"UK Submarine Defence\",\n      \"title\": \"UK SUBMARINE DEFENCE PROGRAMMES\",\n      \"subtitle\": \"Programme Overview at a Glance\",\n      \"legend\": [\n        {\n          \"label\": \"In service / active build\",\n          \"type\": \"active\"\n        },\n        {\n          \"label\": \"Detailed design / long-lead procurement\",\n          \"type\": \"design\"\n        },\n        {\n          \"label\": \"Concept / pre-contract\",\n          \"type\": \"early\"\n        }\n      ],\n      \"programmes\": [\n        {\n          \"status\": \"ACTIVE BUILD / FINISHING\",\n          \"statusType\": \"active\",\n          \"name\": \"Astute Class (SSN)\",\n          \"capacity\": \"7 boats \u00b7 ~\u00a312bn+ programme\",\n          \"milestone\": \"5 in service \u00b7 Achilles (final boat) enters service 2029\",\n          \"partners\": \"BAE Systems \u00b7 Submarine Delivery Agency\"\n        },\n        {\n          \"status\": \"ACTIVE BUILD\",\n          \"statusType\": \"active\",\n          \"name\": \"Dreadnought Class (SSBN)\",\n          \"capacity\": \"4 boats \u00b7 ~\u00a341bn\",\n          \"milestone\": \"All 4 boats cut \u00b7 first in service early 2030s \u00b7 CASD to 2060s\",\n          \"partners\": \"BAE Systems \u00b7 Rolls-Royce \u00b7 Submarine Delivery Agency\"\n        },\n        {\n          \"status\": \"DESIGN / LONG-LEAD\",\n          \"statusType\": \"design\",\n          \"name\": \"SSN-AUKUS (SSN)\",\n          \"capacity\": \"Up to 12 boats label\": \"PWR3+ units under construction, May 2026\"\n        }\n      ],\n      \"timelineTitle\": \"2025\u201326 MILESTONE TIMELINE\",\n      \"milestones\": [\n        {\n          \"date\": \"26 Jul '25\",\n          \"text\": \"UK and Australia sign the Geelong Treaty \u2014 a 50-year bilateral agreement governing joint construction of Australia's SSN-AUKUS submarines.\"\n        },\n        {\n          \"date\": \"22 Feb '26\",\n          \"text\": \"HMS Anson becomes the first RN nuclear submarine to undergo a maintenance period in Australia, at HMAS Stirling.\"\n        },\n        {\n          \"date\": \"24 Feb '26\",\n          \"text\": \"Australia announces A$310m payment to the UK for long-lead reactor items; manufacture of complete welded nuclear propulsion systems begins at Rolls-Royce Submarines, Derby.\"\n        },\n        {\n          \"date\": \"10 Apr '26\",\n          \"text\": \"Australian Submarine Supplier Qualification programme expanded to link Australian businesses into UK submarine supply chains for the first time.\"\n        },\n        {\n          \"date\": \"28 Apr '26\",\n          \"text\": \"UK Parliament's Defence Committee warns of 'shortcomings and failings', flagging delays to the Barrow shipyard upgrade and submarine availability as 'critically low'.\"\n        },\n        {\n          \"date\": \"May '26\",\n          \"text\": \"Defence Secretary John Healey confirms four PWR3+ reactors are under construction at the expanded Rolls-Royce Raynesway facility in Derby.\"\n        }\n      ],\n      \"what_it_means\": \"The largest sustained nuclear manufacturing programme in this briefing \u2014 up to 12 boats, one every 18 months, 21,000 jobs at peak, with billions already committed to Barrow and Derby. Entry requires ITAR clearance and strict quality regimes, but the pipeline is multi-decade and real.\"\n    },\n    {\n      \"id\": 18,\n      \"type\": \"section_header\",\n      \"title\": \"International Programme Lands async function upload() {
  const btn = document.getElementById('btn');
  const st  = document.getElementById('status');
  btn.disabled = true; btn.textContent = 'Uploading…';
  st.textContent = ''; st.className = '';
  try {
    const res = await fetch(URL, {
      method: 'PUT',
      headers: { 'x-ms-blob-type': 'BlockBlob', 'Content-Type': 'application/json' },
      body: DATA
    });
    if (res.ok) {
      st.textContent = '✓ Uploaded successfully! You can close this tab.';
      st.className = 'ok';
      btn.textContent = 'Done';
    } else {
      const txt = await res.text();
      st.textContent = 'Error ' + res.status + ': ' + txt.slice(0, 120);
      st.className = 'err';
      btn.disabled = false; btn.textContent = 'Retry';
    }
  } catch(e) {
    st.textContent = 'Network error: ' + e.message;
    st.className = 'err';
    btn.disabled = false; btn.textContent = 'Retry';
  }
}
